name: Build RG-X30E Pro firmware2 WiFi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: openwrt-21.02
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync \
            unzip zlib1g-dev file wget swig time ccache

      - name: Configure X30E Pro firmware2 with WiFi
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp defconfig/mt7981-ax3000.config .config

          sed -i -E '/^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y$/d' .config
          sed -i -E '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_.*=/d' .config

          cat >> .config <<'EOF'
          CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_ruijie_rg-x30e-pro-firmware2=y
          CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_ruijie_rg-x30e-pro-firmware2=""
          EOF

          make defconfig

          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_ruijie_rg-x30e-pro-firmware2=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-mt_wifi=y' .config

      - name: Download sources
        run: make download -j8

      - name: Build firmware
        run: make -j2 V=s

      - name: Upload X30E Pro firmware2 image
        uses: actions/upload-artifact@v4
        with:
          name: rg-x30e-pro-firmware2-wifi
          path: bin/targets/mediatek/mt7981/*ruijie_rg-x30e-pro-firmware2-squashfs-sysupgrade.bin
          if-no-files-found: error
          
